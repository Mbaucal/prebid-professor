name: Apply regex build fix

on:
  push:
    branches:
      - diagnostics/build-check
    paths:
      - .github/fix-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostics/build-check
          fetch-depth: 0

      - name: Escape comment slashes in ENABLE_PREBID regex
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker/prebid-mode-release.ts')
          source = path.read_text(encoding='utf-8')
          old = r"const declaration = /^(\s*(?:var|let|const)\s+ENABLE_PREBID\s*=\s*).*?(;\s*(?://[^\r\n]*)?[\t ]*)$/m;"
          new = r"const declaration = /^(\s*(?:var|let|const)\s+ENABLE_PREBID\s*=\s*).*?(;\s*(?:\/\/[^\r\n]*)?[\t ]*)$/m;"
          if old not in source:
              raise SystemExit('Expected broken regex was not found; refusing to modify another line.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "Prebid Professor Build Fix"
          git config user.email "actions@users.noreply.github.com"
          git add worker/prebid-mode-release.ts
          git commit -m "Fix ENABLE_PREBID regex syntax"
          git push origin HEAD:diagnostics/build-check
