name: Apply ads.txt multiline manual entry UI

on:
  push:
    branches:
      - feature/ads-txt-manual-multiline
    paths:
      - .github/ads-txt-multiline.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ads-txt-manual-multiline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply multiline UI integration
        run: python3 .github/scripts/apply_ads_txt_multiline_ui.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit UI integration
        run: |
          git config user.name "Prebid Professor Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AdsTxtPanel.tsx
          if git diff --cached --quiet; then
            echo "Ads.txt multiline UI is already committed."
            exit 0
          fi
          git commit -m "Allow multiline manual ads.txt entry paste"
          git push origin HEAD:feature/ads-txt-manual-multiline
