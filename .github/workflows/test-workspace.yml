name: Isolated test workspace checks
on:
  pull_request:
    branches: [main, feature/builtin-runtime-foundation-v1, feature/isolated-runtime-workspace-v1]
    paths:
      - src/components/BuiltinRuntimePreviewPanel.tsx
      - src/builtin-runtime-preview.css
      - src/preview/**
      - worker/**
      - ops/runtime-test/**
      - scripts/**
      - tests/**
      - migrations/**
      - vendor/**
      - package.json
      - package-lock.json
      - tsconfig*.json
      - .github/workflows/test-workspace.yml
  push:
    branches: [feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check both declared test configurations without credentials or network
        run: node scripts/check-test-activation.mjs
      - name: Preserve runtime versions and their recorded history
        run: node scripts/check-runtime-release-history.mjs HEAD^
      - name: Prepare locked built-in generator and schema without accessing any database
        run: |
          node scripts/prepare-builtin-runtime.mjs
          node scripts/prepare-test-workspace.mjs
      - name: Exercise real authentication, compiler, SQL schema and stored-draft HTTP workflow
        run: node --experimental-strip-types --test tests/runtime/test-workspace.test.mjs tests/runtime/test-workspace-schema-guards.test.mjs tests/runtime/draft-release-store.test.mjs tests/runtime/test-workspace-activation.test.mjs tests/runtime/site-runtime-selection.test.mjs tests/runtime/runtime-selection-cas.test.mjs tests/runtime/test-runtime-selection.test.mjs tests/runtime/runtime-release-history.test.mjs tests/runtime/tanjug-pilot.test.mjs
      - name: Verify read-only ads version UI routes
        run: node --experimental-strip-types --test tests/runtime/ads-versions-preview.test.mjs
      - name: Verify isolated bid-cache policy without changing any existing runtime
        run: node --experimental-strip-types --test tests/runtime/bid-cache-policy.test.mjs tests/runtime/cache-lifecycle.test.mjs tests/runtime/cache-compiler.test.mjs tests/runtime/cache-candidate.test.mjs tests/runtime/cache-selection.test.mjs
      - name: Verify isolated experimental delivery, original package bytes and LOCAL A/A Worker
        run: node --experimental-strip-types --test tests/runtime/experiment-delivery.test.mjs tests/runtime/experiment-workerd.test.mjs tests/runtime/experiment-controls.test.mjs tests/runtime/experiment-reporting.test.mjs tests/runtime/gam-report.test.mjs tests/runtime/assignment-collection.test.mjs tests/runtime/experiment-inspect.test.mjs tests/runtime/observed-runtime.test.mjs tests/runtime/observed-candidate.test.mjs tests/runtime/measured-runtime.test.mjs tests/runtime/measured-candidate.test.mjs
      - name: Compile disabled and explicit active TEST configurations without deploying
        working-directory: ops/runtime-test
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --no-install wrangler deploy --config wrangler.jsonc --dry-run --outdir ../../.generated/test-workspace-dry-run
          npx --no-install wrangler deploy --config wrangler.active.jsonc --dry-run --outdir ../../.generated/test-workspace-active-dry-run
      - name: Require the active config to compile to the exact Worker bytes tested below
        run: node scripts/check-test-activation.mjs --compare-bundles
      - name: Verify compiled Worker with LOCAL Miniflare D1 and R2 including restart
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/verify-workerd-workspace.mjs
          node scripts/verify-workerd-selection.mjs
          node scripts/verify-workerd-delivery.mjs
      - name: Install pinned Chromium verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser settings, stale-tab protection, Generate, Save, reopen and exact download
        run: python scripts/verify-test-workspace.py
      - name: Tanjug pilot preview and exact package download with all external traffic blocked
        run: python scripts/verify-tanjug-pilot.py
      - name: New TEST deployment setup and version history (synthetic jobs only)
        run: python scripts/verify-deployment-ui.py
      - name: A/B TEST controls and stale-tab protection (local synthetic browser)
        run: python scripts/verify-experiment-ui.py
      - name: Automatic TEST assignment collection and retry handling in Chromium
        run: python scripts/verify-assignment-collection.py
      - name: Native pinned Prebid cache selection with synthetic bids only
        run: python scripts/verify-bid-cache-policy.py
      - name: Compiled cache candidate lifecycle with synthetic GPT and TCF only
        run: python scripts/verify-cached-runtime.py .generated/cache-package-evidence
      - name: Both TEST cache editors and exact candidate download without ad execution
        run: python scripts/verify-cache-selection.py
      - name: Browser A/B loader dependency ordering, SRI, CSP and duplicate guards
        run: python scripts/verify-experiment-loader.py
      - name: New observed runtime entry and GPT lifecycle in local Chromium
        run: python scripts/verify-observed-runtime.py
      - name: New measured runtime targeting before local mock requests
        run: python scripts/verify-measured-runtime.py
      - name: Keep only synthetic report and screenshots, never sessions or databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-workspace-evidence
          path: |
            .generated/test-workspace-evidence/*.json
            .generated/test-workspace-evidence/*.png
            .generated/tanjug-pilot-evidence/*.json
            .generated/tanjug-pilot-evidence/*.png
            .generated/delivery-evidence/*.json
            .generated/delivery-evidence/*.png
            .generated/experiment-evidence/*.json
            .generated/experiment-evidence/*.png
            .generated/cache-evidence/*.json
            .generated/cache-runtime-evidence/*.json
            .generated/cache-package-evidence/*.json
            .generated/cache-selection-evidence/*.json
            .generated/cache-selection-evidence/*.png
            .generated/experiment-loader-evidence/*.json
            .generated/experiment-loader-evidence/*.png
            .generated/observed-evidence/*.json
            .generated/measured-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
