name: Apply release deletion UI patch

on:
  push:
    branches:
      - feature/release-deletion
    paths:
      - .github/release-delete-ui.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-deletion
          fetch-depth: 0

      - name: Patch releases panel
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/ReleasesPanel.tsx')
          source = path.read_text(encoding='utf-8')
          original = source

          source = source.replace(
              "import ExternalDeploymentsPanel from './ExternalDeploymentsPanel';\n",
              "import ExternalDeploymentsPanel from './ExternalDeploymentsPanel';\nimport ReleaseDeleteButton from './ReleaseDeleteButton';\n",
              1,
          )

          anchor = '''                <button className="rollback-action" disabled={isBusy || !canRollback} onClick={() => void promote(release, 'rollback')} type="button">
                  Rollback to this
                </button>
'''
          replacement = anchor + '''                <ReleaseDeleteButton
                  disabled={isBusy}
                  onDeleted={async (message) => {
                    await load();
                    setSuccess(message);
                    await onChanged?.();
                  }}
                  onError={(message) => setError(message || null)}
                  publisherId={publisherId}
                  release={release}
                />
'''
          if anchor not in source:
              raise SystemExit('Release action anchor was not found.')
          source = source.replace(anchor, replacement, 1)

          if source == original:
              raise SystemExit('ReleasesPanel.tsx was not changed.')
          path.write_text(source, encoding='utf-8')

      - name: Commit UI integration
        run: |
          git config user.name "Prebid Professor Release Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ReleasesPanel.tsx
          git commit -m "Connect release deletion action to release history"
          git push origin HEAD:feature/release-deletion
