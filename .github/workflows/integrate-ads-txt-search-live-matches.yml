name: Integrate ads.txt live matches into search

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/ads-txt-search-live-matches.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Integrate combined live and saved ads.txt search
        run: python3 .github/scripts/integrate_ads_txt_search_live_matches.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AdsTxtPanel.tsx src/ads-txt.css PROJECT.md worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Ads.txt combined search is already integrated."
          else
            git commit -m "Show live ads.txt occurrences in search"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
