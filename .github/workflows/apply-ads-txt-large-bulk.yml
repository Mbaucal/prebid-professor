name: Apply ads.txt large bulk integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ads-txt-large-bulk
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source integration
        run: python3 .github/scripts/apply_ads_txt_large_bulk.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit validated integration
        run: |
          git config user.name "Prebid Professor Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add worker/app-deploy.ts src/components/AdsTxtPanel.tsx
          if git diff --cached --quiet; then
            echo "Ads.txt large bulk integration is already committed."
            exit 0
          fi
          git commit -m "Connect scalable ads.txt bulk workflow"
          git push origin HEAD:feature/ads-txt-large-bulk
