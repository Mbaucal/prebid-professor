name: Integrate monitoring pre-merge hardening

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-premerge-hardening.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate pre-merge hardening
        run: python3 .github/scripts/integrate_monitoring_premerge_hardening.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add worker/monitoring-notification-run.ts src/components/MonitoringReadonlyPanel.tsx worker/app-deploy.ts migrations/0004_gmail_and_monitoring_notifications.sql
          if git diff --cached --quiet; then
            echo "Monitoring pre-merge hardening is already integrated."
          else
            git commit -m "Harden monitoring notifications before production"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
