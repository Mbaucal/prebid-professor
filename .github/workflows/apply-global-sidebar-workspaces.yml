name: Apply global sidebar workspaces

on:
  push:
    branches:
      - feature/global-sidebar-workspaces
    paths:
      - .github/global-sidebar-workspaces.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/global-sidebar-workspaces
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply App integration
        run: python3 .github/scripts/apply_global_sidebar_workspaces.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit App integration
        run: |
          git config user.name "Prebid Professor Global Workspaces"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Global workspace App integration is already committed."
            exit 0
          fi
          git commit -m "Connect global sidebar workspaces"
          git push origin HEAD:feature/global-sidebar-workspaces
