name: Configurable A/B package compiler
on:
  pull_request:
    paths:
      - 'worker/experiments/package-settings-v1.mjs'
      - 'worker/experiments/configurable-cache-v1.mjs'
      - 'worker/experiments/full-cache-v2.mjs'
      - 'worker/experiments/cmp-aa-v1.mjs'
      - 'worker/experiments/static-aa-v1.mjs'
      - 'worker/runtime-cache/**'
      - 'scripts/configurable-ab-package.mjs'
      - 'scripts/prepare-configurable-ab.mjs'
      - 'scripts/verify-tanjug-cache.py'
      - 'tests/runtime/configurable-ab*'
      - '.github/workflows/configurable-ab.yml'
permissions:
  contents: read
jobs:
  configurable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Build from frozen inputs and verify settings/compiler
        run: |
          node scripts/check-runtime-release-history.mjs HEAD^
          node scripts/prepare-builtin-runtime.mjs
          node --experimental-strip-types scripts/prepare-tanjug-pilot.mjs
          node scripts/prepare-tanjug-aa.mjs
          node scripts/prepare-tanjug-compact.mjs
          node scripts/prepare-tanjug-cmp.mjs
          node --test tests/runtime/configurable-ab.test.mjs
          node scripts/prepare-configurable-ab.mjs tests/runtime/configurable-ab-settings.json > .generated/configurable-ab-build.json
          python - <<'PY'
          import json,os
          build=json.load(open('.generated/configurable-ab-build.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TANJUG_PACKAGE_DIR='+build['directory']+'deploy\n')
          PY
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise generated ten-second arms with native Prebid and synthetic demand
        run: python scripts/verify-tanjug-cache.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: configurable-ab-evidence
          path: |
            .generated/configurable-ab-build.json
            .generated/configurable-ab/**/release.json
            .generated/configurable-ab/**/browser-report.json
            .generated/configurable-ab/**/*.zip
          if-no-files-found: error
          retention-days: 30
