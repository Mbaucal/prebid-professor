name: Integrate ads.txt raw repeated lines

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/ads-txt-raw-repeats.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate raw repeated-line visibility
        run: python3 .github/scripts/integrate_ads_txt_raw_repeats.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add worker/ads-txt.ts src/components/AdsTxtPanel.tsx src/ads-txt.css worker/app-deploy.ts PROJECT.md
          if git diff --cached --quiet; then
            echo "Ads.txt raw repeated-line visibility is already integrated."
          else
            git commit -m "Show exact raw ads.txt repeated lines"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
