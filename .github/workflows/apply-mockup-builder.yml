name: Apply Mockup Builder integration

on:
  push:
    branches:
      - feature/mockup-builder
    paths:
      - .github/mockup-builder.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mockup-builder
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate Mockup Builder
        run: python3 .github/scripts/apply_mockup_builder.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Prebid Professor Mockup Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          if git diff --cached --quiet; then
            echo "Mockup Builder source was already integrated."
            exit 0
          fi
          git commit -m "Integrate Mockup Builder into site workspace"
          git push origin HEAD:feature/mockup-builder
