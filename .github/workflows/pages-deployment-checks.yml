name: Pages deployment verification checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths:
      - tools/**
      - ops/runtime-test/**
      - scripts/bootstrap-toolchain.mjs
      - scripts/verify-toolchain-isolation.mjs
      - scripts/prepare-*.mjs
      - package.json
      - package-lock.json
      - scripts/publisher-delivery-verification.mjs
      - worker/test-workspace/delivery-layout.mjs
      - tests/runtime/publisher-delivery.test.mjs
      - scripts/reverify-builtin-test.mjs
      - tests/runtime/builtin-reverification.test.mjs
      - .github/workflows/verify-existing-builtin-test.yml
      - ops/runtime-test/verify-existing.json
      - docs/evidence/*-source.json
      - scripts/builtin-test-delivery.mjs
      - scripts/builtin-pages-preflight.mjs
      - scripts/verify-pinned-wrangler-action.mjs
      - tests/runtime/builtin-pages-preflight.test.mjs
      - worker/test-workspace/deploy*.mjs
      - tests/runtime/builtin-test-delivery.test.mjs
      - tests/support/deployment-store.mjs
      - .github/workflows/deploy-builtin-test.yml
      - scripts/pages-release-verification.mjs
      - worker/deployment-manifest-pin.mjs
      - worker/external-deployments.ts
      - worker/deployment-callback-urls.ts
      - tests/runtime/deployment-callback.test.mjs
      - tests/runtime/pages-deployment.test.mjs
      - .github/workflows/deploy-pages-release.yml
      - .github/workflows/pages-deployment-checks.yml
  push:
    branches: [feature/isolated-runtime-workspace-v1]
    paths:
      - tools/**
      - ops/runtime-test/**
      - scripts/bootstrap-toolchain.mjs
      - scripts/verify-toolchain-isolation.mjs
      - scripts/prepare-*.mjs
      - package.json
      - package-lock.json
      - scripts/publisher-delivery-verification.mjs
      - worker/test-workspace/delivery-layout.mjs
      - tests/runtime/publisher-delivery.test.mjs
      - scripts/reverify-builtin-test.mjs
      - tests/runtime/builtin-reverification.test.mjs
      - .github/workflows/verify-existing-builtin-test.yml
      - ops/runtime-test/verify-existing.json
      - docs/evidence/*-source.json
      - scripts/builtin-test-delivery.mjs
      - scripts/builtin-pages-preflight.mjs
      - scripts/verify-pinned-wrangler-action.mjs
      - tests/runtime/builtin-pages-preflight.test.mjs
      - worker/test-workspace/deploy*.mjs
      - tests/runtime/builtin-test-delivery.test.mjs
      - tests/support/deployment-store.mjs
      - .github/workflows/deploy-builtin-test.yml
      - scripts/pages-release-verification.mjs
      - worker/deployment-manifest-pin.mjs
      - worker/external-deployments.ts
      - worker/deployment-callback-urls.ts
      - tests/runtime/deployment-callback.test.mjs
      - tests/runtime/pages-deployment.test.mjs
      - .github/workflows/deploy-pages-release.yml
      - .github/workflows/pages-deployment-checks.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: node scripts/bootstrap-toolchain.mjs --profile test
      - run: node scripts/prepare-builtin-runtime.mjs
      - run: node scripts/prepare-test-workspace.mjs
      - name: Verify package bytes, target branch, callback retries and existing draft barriers
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/deployment-callback.test.mjs tests/runtime/publisher-delivery.test.mjs tests/runtime/builtin-reverification.test.mjs tests/runtime/pages-deployment.test.mjs tests/runtime/stored-draft-legacy-guards.test.mjs tests/runtime/builtin-test-delivery.test.mjs tests/runtime/builtin-pages-preflight.test.mjs

      - name: Read the exact retained action for offline contract verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cloudflare/wrangler-action
          ref: 9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
          path: .generated/pinned-wrangler-action
          persist-credentials: false
      - name: Verify action tool reuse and outputs with synthetic binaries only
        run: node scripts/verify-pinned-wrangler-action.mjs .generated/pinned-wrangler-action/dist/index.mjs
