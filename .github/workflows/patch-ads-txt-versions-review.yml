name: Patch ads.txt versions review

on:
  push:
    branches:
      - feature/ads-txt-versions-v1
    paths:
      - .github/patch-ads-txt-versions-review.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ads-txt-versions-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply review hardening
        run: python3 .github/scripts/patch_ads_txt_versions_review.py

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard and Worker
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Remove one-time integration files
        run: |
          rm -f .github/scripts/patch_ads_txt_versions_review.py
          rm -f .github/workflows/patch-ads-txt-versions-review.yml
          rm -f .github/patch-ads-txt-versions-review.trigger

      - name: Commit review hardening
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden ads.txt version history" || exit 0
          git push origin HEAD:feature/ads-txt-versions-v1
