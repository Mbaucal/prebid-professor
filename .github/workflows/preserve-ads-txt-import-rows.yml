name: Preserve ads.txt imported partner rows

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/ads-txt-import-duplicates.trigger

permissions:
  contents: write

concurrency:
  group: ads-txt-import-duplicates
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve every imported ads.txt partner row
        run: python3 .github/scripts/preserve_ads_txt_import_rows.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AdsTxtPanel.tsx
          if git diff --cached --quiet; then
            echo "Ads.txt import already preserves partner rows."
          else
            git commit -m "Preserve every imported ads.txt partner row"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi
