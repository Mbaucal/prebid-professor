name: A/B editor and generated delivery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  generic-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/isolated-toolchain.mjs typecheck
      - name: Build MAIN and verify immutable experiment contracts
        run: |
          node scripts/isolated-toolchain.mjs build
          node --experimental-strip-types --test tests/runtime/politika-gam-csv.test.mjs
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/ab-loader*.test.mjs tests/runtime/ab-bundle.test.mjs tests/runtime/ab-store*.test.mjs tests/runtime/ab-tests-api.test.mjs tests/runtime/ab-main-package3251.test.mjs tests/runtime/ab-tests-main.test.mjs tests/runtime/ab-history-main.test.mjs tests/runtime/ab-measurement*.test.mjs tests/runtime/ab-memory-adversarial-qa.test.mjs tests/runtime/gam-report-v2*.test.mjs tests/runtime/ab-version-id-main.test.mjs
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/verify-ab-tests-main-workerd.mjs
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/ab-original-sources.test.mjs
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify MAIN A/B panel and downloaded bytes on desktop and mobile
        run: |
          python scripts/verify-ab-tests-main-ui.py
          python scripts/verify-ab-measurement-main-ui.py
          python scripts/verify-measurement-navigation-ui.py
          python scripts/verify-experiments-workspace-ui.py
          python scripts/verify-measurement-layout-ui.py
          python scripts/verify-gam-report-v2-ui.py
          python scripts/verify-politika-gam-import-ui.py
          python scripts/verify-original-sources-ui.py
      - name: Verify native 3.25.1 delivery, consent and failure recovery
        run: |
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/prepare-ab-loader-main-browser.mjs .generated/ab-loader-main-browser
          python scripts/verify-ab-loader-main-browser.py .generated/ab-loader-main-browser
      - name: Verify slow-arm recovery with bounded real browser transport
        run: |
          node scripts/prepare-ab-loader111-transport-qa.mjs .generated/ab-loader-main-browser .generated/ab-loader111-transport-qa
          python scripts/verify-ab-loader111-transport-qa.py .generated/ab-loader111-transport-qa --ci
      - name: Verify reserved targeting and late-arm ownership on pinned real GPT
        run: |
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/prepare-ab-loader-real-gpt.mjs
          python scripts/verify-ab-loader-real-gpt.py
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/prepare-ab-loader120-real-gpt.mjs
          python scripts/verify-ab-loader120-real-gpt.py
      - name: Verify measurement ledger with native adaptive timeout, fresh auctions and bid cache
        run: |
          node scripts/build-runtime324-prebid.mjs --version 11.34.0
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/prepare-combined-measurement-timeout-qa.mjs --prebid .generated/runtime324-prebid/11.34.0 --out .generated/combined-measurement-timeout-qa
          python scripts/verify-combined-measurement-timeout-qa.py .generated/combined-measurement-timeout-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generic-ab-main-evidence
          path: |
            .generated/ab-tests-main-ui/**
            .generated/ab-measurement-main-ui/**
            .generated/measurement-navigation-ui/**
            .generated/experiments-workspace-ui/**
            .generated/measurement-layout-ui/**
            .generated/gam-report-v2-ui/**
            .generated/politika-gam-import-ui/**
            .generated/original-sources-ui/**
            .generated/ab-tests-main-workerd/**
            .generated/ab-loader-main-browser/**
            .generated/ab-loader111-transport-qa/**
            .generated/ab-loader-real-gpt/**
            .generated/ab-loader120-real-gpt/**
            .generated/combined-measurement-timeout-qa/**
            .generated/runtime324-prebid/11.34.0/manifest.json
          if-no-files-found: error
          retention-days: 30
  ab-editor:
    runs-on: ubuntu-24.04 # Playwright 1.55 browser dependencies are pinned to this supported OS.
    # Include slow Ubuntu dependency downloads; all test commands and their own deadlines stay required.
    timeout-minutes: 25
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/isolated-toolchain.mjs typecheck
      - name: Build app and verify pinned package/service contracts
        run: |
          node scripts/isolated-toolchain.mjs build
          node --test tests/runtime/local-miniflare.test.mjs
          node --test tests/runtime/configurable-ab.test.mjs tests/runtime/ab-editor.test.mjs tests/runtime/full-cache-policy.test.mjs tests/runtime/position-cache-policy.test.mjs tests/runtime/full-cache-lifecycle.test.mjs tests/runtime/experiment-inspect.test.mjs tests/runtime/cache-verifier-observer.test.mjs
          node scripts/verify-ab-editor-workerd.mjs
          node --test tests/runtime/saved-scripts.test.mjs tests/runtime/script-library.test.mjs
          node --test tests/runtime/bid-cache-eligibility.test.mjs
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/prebid-mode-bid-cache.test.mjs
          node scripts/verify-script-library-workerd.mjs
          node --test tests/runtime/position-cache-fixture-timing.test.mjs
          python -m unittest discover -s tests/runtime -p 'test_cache_verifier_diagnostics.py'
          python -m unittest discover -s tests/runtime -p 'test_position_cache_latency.py'
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify per-position auctions and controls
        run: |
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/positions/deploy python scripts/verify-tanjug-cache.py
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/positions-default-off/deploy python scripts/verify-tanjug-cache.py
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/positions/deploy python scripts/verify-position-cache-latency.py
          python scripts/verify-script-library-ui.py
          python scripts/verify-bid-cache-settings-ui.py
      - name: Exercise the editor and downloaded package
        run: |
          python scripts/verify-ab-editor-ui.py
          TANJUG_PACKAGE_DIR=.generated/ab-editor-delivered/deploy python scripts/verify-tanjug-cache.py
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/ab/deploy python scripts/verify-tanjug-cache.py
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/cache/deploy python scripts/verify-tanjug-cache.py
          TANJUG_PACKAGE_DIR=.generated/script-library-delivered/fresh/deploy python scripts/verify-tanjug-cache.py
          SCRIPT_LIBRARY_SMOKE=1 TANJUG_PACKAGE_DIR=.generated/script-library-delivered/aa/deploy python scripts/verify-tanjug-cache.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ab-editor-evidence
          path: |
            .generated/ab-editor-delivered/*.json
            .generated/ab-editor-ui/*.json
            .generated/ab-editor-ui/*.png
            .generated/script-library-delivered/**/*.json
            .generated/script-library-ui/*.json
            .generated/script-library-ui/*.png
            .generated/bid-cache-settings-ui/*.json
            .generated/bid-cache-settings-ui/*.png
          if-no-files-found: error
          retention-days: 30
