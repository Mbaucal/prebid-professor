name: Run release cleanup and SChain feature patch

on:
  push:
    branches:
      - main
    paths:
      - .github/run-release-schain-patch.trigger

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-cleanup-schain-consent-test
          fetch-depth: 0

      - name: Extract feature patch script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-release-schain-consent.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Patch release and runtime workflows\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Commit changes\n'
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('Feature patch start marker was not found.')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('Feature patch end marker was not found.')
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/release_schain_patch.py').write_text(script, encoding='utf-8')

      - name: Apply feature patch
        run: python /tmp/release_schain_patch.py

      - name: Commit feature changes
        run: |
          git config user.name "Prebid Professor Feature Builder"
          git config user.email "actions@users.noreply.github.com"
          git add worker src
          git commit -m "Add release deletion, SChain controls and contextual CMP testing"
          git push origin HEAD:feature/release-cleanup-schain-consent-test
