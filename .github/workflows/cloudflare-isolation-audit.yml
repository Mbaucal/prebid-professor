name: Cloudflare isolation audit

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/cloudflare/**
      - tests/cloudflare/**
      - ops/tessera-isolation-plan.json
      - .github/workflows/cloudflare-isolation-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/cloudflare/**
      - tests/cloudflare/**
      - ops/tessera-isolation-plan.json
      - .github/workflows/cloudflare-isolation-audit.yml
  workflow_dispatch:
    inputs:
      test_worker:
        description: Exact Worker script name, not a hostname or branch alias
        required: true
        type: string
      test_version_id:
        description: Exact Cloudflare version UUID to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test isolation audit with synthetic responses only
        run: node --test tests/cloudflare/isolation-audit.test.mjs

  read-cloudflare-metadata:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-tests
    environment: tessera-isolation-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact version bindings without changing Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_TEST_WORKER: ${{ inputs.test_worker }}
          CF_TEST_VERSION_ID: ${{ inputs.test_version_id }}
          CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
        run: |
          mkdir -p .generated
          node scripts/cloudflare/audit-isolation.mjs > .generated/cloudflare-isolation-audit.json
      - name: Store sanitized metadata report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-isolation-metadata-${{ github.run_id }}
          path: .generated/cloudflare-isolation-audit.json
          if-no-files-found: ignore
          retention-days: 7
