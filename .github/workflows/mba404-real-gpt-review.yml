name: MBA-404 real GPT review (no ad traffic)
on:
  push:
    branches: [review/mba404-real-gpt]
permissions:
  contents: read
jobs:
  gpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/builtin-toolchain.mjs bootstrap && node scripts/isolated-toolchain.mjs prepare
      - run: node scripts/prepare-boot3212-browser.mjs
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Real GPT library, synthetic CMP and intercepted GAM wire requests
        run: python scripts/review-real-gpt.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-gpt-review
          path: .generated/real-gpt-review/
          if-no-files-found: warn
