name: TEST site editor checks
on:
  pull_request:
    branches: [feature/isolated-runtime-workspace-v1]
    paths: [worker/**, tests/**, scripts/**, .github/workflows/site-editor-checks.yml]
  push:
    branches: [feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-test-activation.mjs && node scripts/prepare-builtin-runtime.mjs && node scripts/prepare-test-workspace.mjs
      - run: node --experimental-strip-types --test tests/runtime/site-draft.test.mjs tests/runtime/test-site-editor-http.test.mjs tests/runtime/ad-position-runtime.test.mjs
      - name: Compile TEST only; no deployment
        working-directory: ops/runtime-test
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --config wrangler.active.jsonc --dry-run --outdir ../../.generated/test-workspace-active-dry-run
      - name: Compiled workerd and local D1/R2 editor checks
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-workerd-site-editor.mjs
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify-site-editor.py
      - run: node --experimental-strip-types scripts/prepare-position-browser-fixtures.mjs && python scripts/verify-position-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-editor-evidence
          path: |
            .generated/site-editor-evidence/
            .generated/position-evidence/
          if-no-files-found: ignore
          retention-days: 14
