name: TEST site editor checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths: [tools/**, package.json, package-lock.json, ops/runtime-test/**, ops/test-worker/**, wrangler.jsonc, worker/**, src/**, public/**, index.html, shared/**, vendor/**, migrations/**, tests/**, scripts/**, .github/workflows/site-editor-checks.yml]
  push:
    branches: [main, feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  generation-parity:
    # Generated ads.js from the compiled production Worker must equal a direct compile and run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - name: Build the production Worker exactly as deploy uploads it (dist, no_bundle)
        run: node scripts/isolated-toolchain.mjs build && node scripts/prepare-test-workspace.mjs
      - name: Every serialized function has canonical source text installed by its Worker entry
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/canonical-browser-text.test.mjs
      - name: Every selectable runtime from the compiled Worker on LOCAL workerd equals the direct compile
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/verify-dist-generation-parity.mjs
      - name: Install pinned Chromium verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run every generated ads.js and ads.min.js with GPT mock and granted consent (no network)
        run: python scripts/verify-generation-parity-browser.py
      - name: Keep only the synthetic generation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generation-parity-evidence
          path: |
            .generated/generation-parity/manifest.json
            .generated/generation-parity/browser-results.json
          if-no-files-found: ignore
          retention-days: 14
  editor:
    runs-on: ubuntu-24.04 # Playwright 1.55 browser dependencies are pinned to this supported OS.
    timeout-minutes: 20
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/check-test-activation.mjs && node scripts/isolated-toolchain.mjs prepare && node scripts/prepare-test-workspace.mjs
      - name: Verify login redirects and publisher HTML isolation
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/auth-redirect.test.mjs tests/runtime/login-rate-limit.test.mjs tests/runtime/test-login-security.test.mjs tests/runtime/test-workspace-schema-guards.test.mjs tests/runtime/release-html-security.test.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/site-draft.test.mjs tests/runtime/test-site-editor-http.test.mjs tests/runtime/ad-position-runtime.test.mjs tests/runtime/site-runtime-service.test.mjs tests/runtime/site-duplication.test.mjs tests/runtime/site-package-flow.test.mjs tests/runtime/browser-package-download.test.mjs tests/runtime/size-map-csv-template.test.mjs tests/runtime/site-test-page.test.mjs
      - name: Verify release deletion through the authenticated dashboard route
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/release-deletion-http.test.mjs tests/runtime/stored-draft-legacy-guards.test.mjs
      - name: Preserve audited rule edits, user sync defaults and exact Prebid files
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/admin-rules-and-sync-audit.test.mjs tests/runtime/admin-unit-rule-concurrency.test.mjs tests/runtime/prebid-digit-modules-flow.test.mjs tests/runtime/lotame-user-id.test.mjs tests/runtime/compiler-input-compatibility.test.mjs tests/runtime/refresh-summary.test.mjs tests/runtime/size-map-compatibility.test.mjs tests/runtime/generator-guard-audit.test.mjs tests/runtime/inactive-override-package-qa.test.mjs tests/runtime/runtime3201-package-qa.test.mjs tests/runtime/outstream-runtime-eligibility.test.mjs
      - name: Verify contextual taxonomy settings, auction isolation and build integration
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/contextual-signals-*.test.mjs
      - name: Reproduce and prevent the independent audit failures
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/audit-size-map-selection.test.mjs tests/runtime/consent-storage3211.test.mjs tests/runtime/contextual-rtd-ownership.test.mjs tests/runtime/size-map-references.test.mjs tests/runtime/runtime3211-package-qa.test.mjs tests/runtime/boot3212.test.mjs tests/runtime/runtime3212-package-qa.test.mjs
      - name: 3.23.0 bid caching, package QA and the policy in the whole generated ads.min.js (node:vm, synthetic bids)
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/runtime323-package-qa.test.mjs tests/runtime/bid-cache323.test.mjs tests/runtime/bid-cache-eligibility.test.mjs
      - name: Combined 3.24.0 admission, package and immutable-source regressions
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/runtime324*.test.mjs tests/runtime/bid-cache324.test.mjs
      - name: Verify audited 3.22.x composition, lazy auction ownership and immutable history
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/runtime3221-package-qa.test.mjs tests/runtime/script-version-guidance.test.mjs tests/runtime/group-rule-format-scripts.test.mjs tests/runtime/runtime3222-lazy.test.mjs tests/runtime/runtime-lineage.test.mjs tests/runtime/runtime-release-history.test.mjs tests/runtime/runtime-allow-list-parity.test.mjs
      - name: Verify bidder eligibility and generated request isolation
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/bidder-rules-*.test.mjs
      - name: Verify console SChain evidence and transparent network observation
        run: node --test tests/runtime/schain-inspect.test.mjs tests/runtime/experiment-inspect.test.mjs
      - run: node scripts/isolated-toolchain.mjs build
      - name: Verify security boundaries in the compiled production Worker
        run: node scripts/verify-artifact-boundary.mjs && node scripts/verify-auth-boundaries.mjs
      - name: Verify anonymous login branding and protected asset boundary
        run: node scripts/verify-login-logo.mjs
      - run: node scripts/verify-site-duplication-workerd.mjs
      - name: Size-map rename cascade, delete confirmation and rule map gate on compiled Worker and local D1
        run: node scripts/verify-size-map-references-workerd.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/loading-summary.test.mjs
      - name: Compile TEST only; no deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/isolated-toolchain.mjs test-dry-run
      - name: Compiled workerd and local D1/R2 editor checks
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-workerd-site-editor.mjs
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0 && python -m playwright install --with-deps chromium
      - name: Decode branding assets and inspect the complete login logo
        run: python scripts/verify-login-branding.py
      - name: Verify keyboard login, rate limit and retry on desktop and mobile
        run: python scripts/verify-login-recovery.py && python scripts/verify-login-recovery.py --test-workspace
      - name: Size-map and runtime-control editing, errors and recovery
        run: |
          python scripts/verify-size-map-heights-ui.py
          python scripts/verify-runtime-controls-validation-ui.py
          python scripts/verify-inactive-media-ui-qa.py
          python scripts/verify-draft-inventory-ui.py
      - name: Rule map references, rename recovery and supported scope on desktop and narrow screens
        run: python scripts/verify-size-map-references-ui.py
      - name: Page-type size maps keep their selection after a base-map rename (GPT mock, no network)
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs scripts/prepare-page-type-map-selection.mjs && python scripts/verify-page-type-map-selection.py
      - name: Contextual signal editor on desktop and narrow screens
        run: python scripts/verify-contextual-signals-ui.py
      - name: Full generated storage and CMP regression on readable and minified 3.21.1 and 3.21.2 scripts
        run: |
          node scripts/prepare-storage3211-browser.mjs
          python scripts/verify-storage3211-browser.py
          node scripts/prepare-storage3212-browser.mjs
          python scripts/verify-storage3211-browser.py .generated/storage3212-browser
      - name: 3.21.2 boot at load, held GPT start, TakeOver cap and load-time page targeting against 3.21.0
        run: node scripts/prepare-boot3212-browser.mjs && python scripts/verify-boot3212-browser.py
      - name: Lazy observer ordering on full readable and minified 3.22.2 scripts
        run: node --experimental-strip-types scripts/prepare-lazy3222-browser-fixtures.mjs && python scripts/verify-lazy3222-browser.py
      - name: 3.23.0 bid caching, deal keys and preset targeting with the vendored Prebid.js 11.34.0 on desktop and mobile (synthetic bidders and CMP, no network)
        run: node scripts/prepare-bidcache323-browser.mjs && python scripts/verify-bidcache323-browser.py
      - name: Bidder rule editor and simulator on desktop and narrow screens
        run: python scripts/verify-bidder-rules-ui.py
      - run: python scripts/verify-site-editor.py
      - run: python scripts/verify-site-workspace.py
      - run: node --experimental-strip-types scripts/prepare-test-page-browser-fixture.mjs && python scripts/verify-site-test-page.py
      - run: python scripts/verify-release-setup.py
      - run: python scripts/verify-release-deletion-ui.py
      - run: python scripts/verify-loading-summary.py
      - name: Verify copied SChain commands and Debug UI on desktop and mobile
        run: node scripts/prepare-schain-debug-fixture.mjs && python scripts/verify-schain-debug.py
      - run: node --experimental-strip-types scripts/prepare-position-browser-fixtures.mjs && python scripts/verify-position-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-editor-evidence
          path: |
            .generated/release-deletion-ui/
            .generated/storage3211-browser/
            .generated/storage3212-browser/
            .generated/boot3212-browser/
            .generated/bidcache323-browser/manifest.json
            .generated/bidcache323-browser/browser-report.json
            .generated/size-map-references-ui/
            .generated/page-type-map-selection/
            .generated/size-map-height-ui/
            .generated/runtime-controls-validation-ui/
            .generated/inactive-media-ui-qa/
            .generated/draft-inventory-ui/
            .generated/contextual-signals-ui-evidence/
            .generated/bidder-rules-ui-evidence/
            .generated/lazy3222-evidence/
            .generated/site-editor-evidence/
            .generated/position-evidence/
            .generated/site-workspace-evidence/
            .generated/test-page-evidence/
            .generated/loading-summary-evidence/
            .generated/schain-debug-evidence/
            .generated/login-branding-evidence/
            .generated/login-recovery-evidence/
            .generated/test-login-recovery-evidence/
          if-no-files-found: ignore
          retention-days: 14
  bid-cache-prebid:
    # The vendored Tanjug build is 11.34.0; other sites run other Prebid versions (Politika: 11.11.0).
    name: Bid caching and combined runtime · upstream Prebid ${{ matrix.prebid }}
    runs-on: ubuntu-24.04 # Playwright 1.55 browser dependencies are pinned to this supported OS.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prebid: ['11.11.0', '11.34.0']
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - name: Compile pinned upstream Prebid with the vendored Tanjug 11.34.0 module list
        run: node scripts/build-bidcache-prebid.mjs --version "${{ matrix.prebid }}"
      - run: node scripts/check-test-activation.mjs && node scripts/isolated-toolchain.mjs prepare && node scripts/prepare-test-workspace.mjs
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: 3.23.0 bid caching with upstream Prebid.js on desktop and mobile (synthetic bidders and CMP, no network)
        run: |
          node scripts/prepare-bidcache323-browser.mjs --prebid ".generated/bidcache-prebid/${{ matrix.prebid }}" --out ".generated/bidcache323-browser-${{ matrix.prebid }}"
          python scripts/verify-bidcache323-browser.py ".generated/bidcache323-browser-${{ matrix.prebid }}"
      - name: Build pinned native Prebid with contextual and activity modules for combined checks
        run: node scripts/build-runtime324-prebid.mjs --version "${{ matrix.prebid }}"
      - name: Combined aliases, SChain, rules, cache and consent on complete generated programs
        run: |
          node scripts/prepare-runtime324-browser-fixtures.mjs --prebid ".generated/runtime324-prebid/${{ matrix.prebid }}" --out ".generated/runtime324-browser-${{ matrix.prebid }}"
          python scripts/verify-runtime324-browser.py ".generated/runtime324-browser-${{ matrix.prebid }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bid-cache-prebid-${{ matrix.prebid }}
          path: |
            .generated/bidcache-prebid/${{ matrix.prebid }}/manifest.json
            .generated/bidcache323-browser-${{ matrix.prebid }}/manifest.json
            .generated/bidcache323-browser-${{ matrix.prebid }}/browser-report.json
            .generated/runtime324-prebid/${{ matrix.prebid }}/manifest.json
            .generated/runtime324-browser-${{ matrix.prebid }}/manifest.json
            .generated/runtime324-browser-${{ matrix.prebid }}/browser-results.json
          if-no-files-found: ignore
          retention-days: 14
