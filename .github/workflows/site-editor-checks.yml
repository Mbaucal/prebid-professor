name: TEST site editor checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths: [tools/**, package.json, package-lock.json, ops/runtime-test/**, wrangler.jsonc, worker/**, src/**, public/**, index.html, shared/inventory/**, shared/contextual-signals/**, shared/size-maps/**, shared/outstream/**, tests/**, scripts/**, .github/workflows/site-editor-checks.yml]
  push:
    branches: [main, feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/check-test-activation.mjs && node scripts/isolated-toolchain.mjs prepare && node scripts/prepare-test-workspace.mjs
      - name: Verify login redirects and publisher HTML isolation
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/auth-redirect.test.mjs tests/runtime/login-rate-limit.test.mjs tests/runtime/test-login-security.test.mjs tests/runtime/test-workspace-schema-guards.test.mjs tests/runtime/release-html-security.test.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/site-draft.test.mjs tests/runtime/test-site-editor-http.test.mjs tests/runtime/ad-position-runtime.test.mjs tests/runtime/site-runtime-service.test.mjs tests/runtime/site-duplication.test.mjs tests/runtime/site-package-flow.test.mjs tests/runtime/browser-package-download.test.mjs tests/runtime/size-map-csv-template.test.mjs tests/runtime/site-test-page.test.mjs
      - name: Preserve audited rule edits, user sync defaults and exact Prebid files
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/admin-rules-and-sync-audit.test.mjs tests/runtime/admin-unit-rule-concurrency.test.mjs tests/runtime/prebid-digit-modules-flow.test.mjs tests/runtime/compiler-input-compatibility.test.mjs tests/runtime/refresh-summary.test.mjs tests/runtime/size-map-compatibility.test.mjs tests/runtime/generator-guard-audit.test.mjs tests/runtime/inactive-override-package-qa.test.mjs tests/runtime/runtime3201-package-qa.test.mjs tests/runtime/outstream-runtime-eligibility.test.mjs
      - name: Verify contextual taxonomy settings, auction isolation and build integration
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/contextual-signals-*.test.mjs
      - name: Reproduce and prevent the independent audit failures
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/audit-size-map-selection.test.mjs tests/runtime/consent-storage3211.test.mjs tests/runtime/contextual-rtd-ownership.test.mjs tests/runtime/size-map-references.test.mjs tests/runtime/runtime3211-package-qa.test.mjs tests/runtime/boot3212.test.mjs tests/runtime/runtime3212-package-qa.test.mjs
      - name: Verify console SChain evidence and transparent network observation
        run: node --test tests/runtime/schain-inspect.test.mjs tests/runtime/experiment-inspect.test.mjs
      - run: node scripts/isolated-toolchain.mjs build
      - name: Verify security boundaries in the compiled production Worker
        run: node scripts/verify-artifact-boundary.mjs && node scripts/verify-auth-boundaries.mjs
      - name: Verify anonymous login branding and protected asset boundary
        run: node scripts/verify-login-logo.mjs
      - run: node scripts/verify-site-duplication-workerd.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/loading-summary.test.mjs
      - name: Compile TEST only; no deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/isolated-toolchain.mjs test-dry-run
      - name: Compiled workerd and local D1/R2 editor checks
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-workerd-site-editor.mjs
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0 && python -m playwright install --with-deps chromium
      - name: Decode branding assets and inspect the complete login logo
        run: python scripts/verify-login-branding.py
      - name: Verify keyboard login, rate limit and retry on desktop and mobile
        run: python scripts/verify-login-recovery.py && python scripts/verify-login-recovery.py --test-workspace
      - name: Size-map and runtime-control editing, errors and recovery
        run: |
          python scripts/verify-size-map-heights-ui.py
          python scripts/verify-runtime-controls-validation-ui.py
          python scripts/verify-inactive-media-ui-qa.py
          python scripts/verify-draft-inventory-ui.py
      - name: Rule map references, rename recovery and supported scope on desktop and narrow screens
        run: python scripts/verify-size-map-references-ui.py
      - name: Contextual signal editor on desktop and narrow screens
        run: python scripts/verify-contextual-signals-ui.py
      - name: Full generated storage and CMP regression on readable and minified 3.21.1 and 3.21.2 scripts
        run: |
          node scripts/prepare-storage3211-browser.mjs
          python scripts/verify-storage3211-browser.py
          node scripts/prepare-storage3212-browser.mjs
          python scripts/verify-storage3211-browser.py .generated/storage3212-browser
      - name: 3.21.2 boot at load, held GPT start, TakeOver cap and load-time page targeting against 3.21.0
        run: node scripts/prepare-boot3212-browser.mjs && python scripts/verify-boot3212-browser.py
      - run: python scripts/verify-site-editor.py
      - run: python scripts/verify-site-workspace.py
      - run: node --experimental-strip-types scripts/prepare-test-page-browser-fixture.mjs && python scripts/verify-site-test-page.py
      - run: python scripts/verify-release-setup.py
      - run: python scripts/verify-loading-summary.py
      - name: Verify copied SChain commands and Debug UI on desktop and mobile
        run: node scripts/prepare-schain-debug-fixture.mjs && python scripts/verify-schain-debug.py
      - run: node --experimental-strip-types scripts/prepare-position-browser-fixtures.mjs && python scripts/verify-position-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-editor-evidence
          path: |
            .generated/storage3211-browser/
            .generated/storage3212-browser/
            .generated/boot3212-browser/
            .generated/size-map-references-ui/
            .generated/size-map-height-ui/
            .generated/runtime-controls-validation-ui/
            .generated/inactive-media-ui-qa/
            .generated/draft-inventory-ui/
            .generated/contextual-signals-ui-evidence/
            .generated/site-editor-evidence/
            .generated/position-evidence/
            .generated/site-workspace-evidence/
            .generated/test-page-evidence/
            .generated/loading-summary-evidence/
            .generated/schain-debug-evidence/
            .generated/login-branding-evidence/
            .generated/login-recovery-evidence/
            .generated/test-login-recovery-evidence/
          if-no-files-found: ignore
          retention-days: 14
