name: Apply Tessera branding

on:
  push:
    branches:
      - feature/tessera-branding
    paths:
      - .github/tessera-branding.trigger

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4
        with:
          ref: feature/tessera-branding
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Tessera branding
        run: python3 .github/scripts/apply_tessera_branding.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit branded source
        run: |
          git config user.name "Tessera Branding"
          git config user.email "actions@users.noreply.github.com"
          git add README.md src/App.tsx src/styles.css worker/auth.ts worker/releases.ts worker/runtime-controls-release.ts worker/ads-txt.ts worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Tessera branding is already committed."
            exit 0
          fi
          git commit -m "Apply Tessera product branding"
          git push origin HEAD:feature/tessera-branding
