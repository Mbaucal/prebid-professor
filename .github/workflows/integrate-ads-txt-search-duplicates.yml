name: Integrate ads.txt search and duplicate inspection

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/ads-txt-search-duplicates.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Integrate ads.txt workspace improvements
        run: python3 .github/scripts/integrate_ads_txt_search_duplicates.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add worker/ads-txt.ts src/components/AdsTxtPanel.tsx src/ads-txt.css PROJECT.md
          if git diff --cached --quiet; then
            echo "Ads.txt search and duplicate inspection are already integrated."
          else
            git commit -m "Add ads.txt search and duplicate inspection"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi
