name: Apply release cleanup, SChain and consent controls

on:
  push:
    branches:
      - feature/release-cleanup-schain-consent-test
    paths:
      - .github/release-schain-consent.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-cleanup-schain-consent-test
          fetch-depth: 0

      - name: Patch release and runtime workflows
