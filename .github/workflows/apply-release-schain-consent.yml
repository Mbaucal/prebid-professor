async function prefixStorage(bucket: R2Bucket, prefix: string): Promise<{ objects: number; bytes: number }> {
  let cursor: string | undefined;
  let objects = 0;
  let bytes = 0;
  do {
    const page = await bucket.list({ prefix, cursor });
    objects += page.objects.length;
    bytes += page.objects.reduce((total, object) => total + Number(object.size || 0), 0);
    cursor = page.truncated ? page.cursor : undefined;
  } while (cursor);
  return { objects, bytes };
}
''',
