          guard_helpers = r'''async function releaseConsentMode(env: ReleaseEnv, release: ReleaseRow): Promise<string> {
  if (!env.BUILDS || !release.config_key) return 'cmp';
  const object = await env.BUILDS.get(release.config_key);
  if (!object) return 'cmp';
  try {
    const config = JSON.parse(await object.text()) as unknown;
    if (!isRecord(config)) return 'cmp';
    const runtime = isRecord(config.runtimeControls) ? config.runtimeControls : {};
    const consent = isRecord(runtime.consent) ? runtime.consent : {};
    return consent.mode === 'contextual-test' ? 'contextual-test' : 'cmp';
  } catch {
    return 'cmp';
  }
}

export async function deleteRelease(
  request: Request,
  env: ReleaseEnv,
  siteId: string,
  releaseId: string,
): Promise<Response> {
  if (!env.DB) return databaseMissing();
  if (!env.BUILDS) return storageMissing();
  const release = await fetchRelease(env.DB, siteId, releaseId);
  if (!release) return apiError('Release not found.', 404);
  if (release.status === 'production' || release.status === 'staging') {
    return apiError('Production and staging releases must be replaced before they can be deleted.', 409);
  }

  const publisher = await env.DB.prepare('SELECT current_release_id FROM publishers WHERE id = ? LIMIT 1')
    .bind(siteId)
    .first<{ current_release_id: string | null }>();
  if (publisher?.current_release_id === releaseId) {
    return apiError('The current production release cannot be deleted.', 409);
  }

  const prefix = releasePrefix(siteId, release.version);
  let storage = { objects: 0, bytes: 0 };
  try {
    storage = await prefixStorage(env.BUILDS, prefix);
    await deletePrefix(env.BUILDS, prefix);
  } catch (error) {
    return apiError('Release artifacts could not be deleted from R2.', 500, error instanceof Error ? error.message : String(error));
  }

  const actor = getActor(request);
  const now = new Date().toISOString();
  try {
    await env.DB.batch([
      env.DB.prepare(`INSERT INTO audit_log (
        id, actor, action, publisher_id, entity_type, entity_id, details_json, created_at
      ) VALUES (?, ?, 'release.deleted', ?, 'release', ?, ?, ?)`) 
        .bind(
          crypto.randomUUID(),
          actor,
          siteId,
          releaseId,
          JSON.stringify({ version: release.version, status: release.status, ...storage }),
          now,
        ),
      env.DB.prepare('DELETE FROM external_deployments WHERE release_id = ?').bind(releaseId),
      env.DB.prepare('DELETE FROM releases WHERE publisher_id = ? AND id = ?').bind(siteId, releaseId),
    ]);
  } catch (error) {
    return apiError(
      'R2 artifacts were removed, but release metadata could not be deleted. Retry the deletion.',
      500,
      error instanceof Error ? error.message : String(error),
    );
  }

  return json({
    ok: true,
    deleted: {
      id: releaseId,
      version: release.version,
      status: release.status,
      objectsDeleted: storage.objects,
      bytesFreed: storage.bytes,
    },
  });
}

