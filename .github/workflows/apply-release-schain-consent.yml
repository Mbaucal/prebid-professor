          helper_anchor = 'function stripTrailingLineComment(line: string): string {'
          helpers = r'''function patchSchain(source: string, controls: RuntimeControls): string {
  if (!controls.schain.configured) return source;

  const schainConfig = controls.schain.enabled
    ? {
        ver: controls.schain.version,
        complete: controls.schain.complete,
        nodes: controls.schain.nodes,
      }
    : null;
  source = replaceVar(source, 'SCHAIN_CONFIG', schainConfig, true);

  const ortbPattern = /ortb2\s*:\s*\{\s*source\s*:\s*\{\s*schain\s*:\s*SCHAIN_CONFIG\s*\}\s*\}\s*,/;
  const conditional = 'ortb2: SCHAIN_CONFIG ? { source: { schain: SCHAIN_CONFIG } } : {},';
  if (ortbPattern.test(source)) return source.replace(ortbPattern, conditional);
  if (source.includes(conditional)) return source;
  throw new Error('Generated runtime SChain insertion point was not found.');
}

function patchConsent(source: string, controls: RuntimeControls): string {
  source = ensureVarAfter(source, 'SCHAIN_CONFIG', 'CMP_MODE', controls.consent.mode);

  const resolvePattern = /(function\s+resolveConsent\(cb(?:,\s*timeoutMs)?\)\s*\{)/;
  if (!source.includes('test:contextual-no-cmp')) {
    if (!resolvePattern.test(source)) throw new Error('Generated runtime consent resolver was not found.');
    source = source.replace(
      resolvePattern,
      '$1\n    if (CMP_MODE === "contextual-test") { cb({p:false,src:"test:contextual-no-cmp"}); return; }',
    );
  }

  if (!source.includes('CMP_MODE === "contextual-test") gdprConsentConfig')) {
    const configAnchor = /(\n\s*try\{\s*\n\s*pbjs\.setConfig\(\{)/;
    if (!configAnchor.test(source)) throw new Error('Generated runtime Prebid configuration anchor was not found.');
    source = source.replace(
      configAnchor,
      '\n      if (CMP_MODE === "contextual-test") gdprConsentConfig = { enabled: false };\n$1',
    );
  }

  if (!source.includes('deviceAccess: CMP_MODE !== "contextual-test"')) {
    const debugPattern = /(debug\s*:\s*false\s*,)/;
    if (!debugPattern.test(source)) throw new Error('Generated runtime Prebid debug setting was not found.');
    source = source.replace(debugPattern, '$1\n        deviceAccess: CMP_MODE !== "contextual-test",');
  }

  source = source.replace(/syncEnabled\s*:\s*true\s*,/, 'syncEnabled: CMP_MODE !== "contextual-test",');
  source = source.replace(/userIds\s*:\s*userIds\s*,/, 'userIds: CMP_MODE === "contextual-test" ? [] : userIds,');

  const existing = /^\s*window\.ADOPS_CONSENT_MODE\s*=/m;
  if (existing.test(source)) {
    source = replaceWindowValue(source, 'ADOPS_CONSENT_MODE', controls.consent.mode);
  } else {
    const marker = /^(\s*window\.ADOPS_GENERATOR_PROFILE_VERSION\s*=\s*[^;]+;[\t ]*)$/m;
    if (marker.test(source)) {
      source = source.replace(marker, `$1\n      window.ADOPS_CONSENT_MODE = ${jsonLiteral(controls.consent.mode)};`);
    }
  }
  return source;
}

