name: Integrate site monitoring

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate monitoring workspace
        run: python3 .github/scripts/integrate_site_monitoring.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/components/SettingsPanel.tsx worker/app-deploy.ts wrangler.jsonc
          if git diff --cached --quiet; then
            echo "Monitoring integration is already committed."
            exit 0
          fi
          git commit -m "Connect site monitoring workspace"
          git push origin HEAD:${{ github.head_ref }}
