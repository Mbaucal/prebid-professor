name: Integrate monitoring test email

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-test-email.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate manual test email
        run: python3 .github/scripts/integrate_monitoring_test_email.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/MonitoringReadonlyPanel.tsx src/main.tsx worker/monitoring-readonly.ts worker/app-deploy.ts wrangler.jsonc
          if git diff --cached --quiet; then
            echo "Manual test email integration is already committed."
            exit 0
          fi
          git commit -m "Enable manual monitoring test emails"
          git push origin HEAD:feature/monitoring-readonly-v1
