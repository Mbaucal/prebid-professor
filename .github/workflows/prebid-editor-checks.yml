name: TEST Prebid editor checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths: [tools/**, package.json, package-lock.json, ops/runtime-test/**, wrangler.jsonc, worker/**, shared/contextual-signals/**, tests/**, scripts/**, .github/workflows/prebid-editor-checks.yml]
  push:
    branches: [feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04 # Playwright 1.55 browser dependencies are pinned to this supported OS.
    timeout-minutes: 15
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/check-test-activation.mjs && node scripts/isolated-toolchain.mjs prepare && node scripts/prepare-test-workspace.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/test-prebid-*.test.mjs
      - name: Compile TEST only; no deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/isolated-toolchain.mjs test-dry-run
      - name: Compiled workerd and local D1/R2 editor checks
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-workerd-prebid.mjs
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify-prebid-editor.py
      - run: python scripts/verify-prebid-config.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prebid-editor-evidence
          path: |
            .generated/prebid-editor-evidence/
            .generated/prebid-config-evidence/
          if-no-files-found: ignore
          retention-days: 14

  contextual-native:
    name: Contextual signals · Prebid ${{ matrix.prebid }}
    runs-on: ubuntu-24.04 # Playwright 1.55 browser dependencies are pinned to this supported OS.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prebid: ['11.11.0', '11.34.0']
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs
      - name: Compile pinned upstream Prebid with the contextual RTD module
        run: node scripts/verify-contextual-prebid-build.mjs --version "${{ matrix.prebid }}"
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Verify real adapter payloads with synthetic responses and no live ad traffic
        run: python scripts/verify-contextual-prebid-wire.py --version "${{ matrix.prebid }}"
      - name: Verify full generated 3.21.1 wrappers through native RTD and consent gates
        run: |
          node scripts/isolated-toolchain.mjs prepare
          node --experimental-strip-types scripts/prepare-audit3211-browser-fixtures.mjs
          python scripts/verify-audit3211-contextual-wrapper.py --version "${{ matrix.prebid }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contextual-prebid-${{ matrix.prebid }}
          path: |
            .generated/contextual-prebid/${{ matrix.prebid }}/manifest.json
            .generated/contextual-prebid/${{ matrix.prebid }}/wire-results.json
            .generated/contextual-prebid/${{ matrix.prebid }}/wrapper-results.json
          if-no-files-found: ignore
          retention-days: 14
