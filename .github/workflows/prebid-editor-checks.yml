name: TEST Prebid editor checks
on:
  pull_request:
    branches: [feature/isolated-runtime-workspace-v1]
    paths: [worker/**, tests/**, scripts/**, tools/**, ops/runtime-test/**, package.json, package-lock.json, .github/workflows/prebid-editor-checks.yml]
  push:
    branches: [feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/bootstrap-toolchain.mjs --profile test
      - run: node scripts/check-test-activation.mjs && node scripts/prepare-builtin-runtime.mjs && node scripts/prepare-test-workspace.mjs
      - run: node --experimental-strip-types --test tests/runtime/test-prebid-*.test.mjs
      - name: Compile TEST only; no deployment
        working-directory: ops/runtime-test
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node ../../scripts/isolated-toolchain.mjs test-dry-run --profile test
      - name: Compiled workerd and local D1/R2 editor checks
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/verify-workerd-prebid.mjs
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify-prebid-editor.py
      - run: python scripts/verify-prebid-config.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prebid-editor-evidence
          path: |
            .generated/prebid-editor-evidence/
            .generated/prebid-config-evidence/
          if-no-files-found: ignore
          retention-days: 14
