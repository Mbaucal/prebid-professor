name: Runtime foundation tests
on:
  pull_request:
    paths:
      - 'worker/runtime/**'
      - 'scripts/*reference391.mjs'
      - 'tests/runtime/**'
      - '.github/workflows/runtime-foundation-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact version pins and extraction safeguards
        run: node --test tests/runtime/foundation.test.mjs
