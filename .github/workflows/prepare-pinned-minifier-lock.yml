name: Prepare pinned minifier lock
on:
  push:
    branches: [feature/builtin-runtime-foundation-v1]
    paths: [.github/workflows/prepare-pinned-minifier-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/builtin-runtime-foundation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce the reviewed lock and verify exact bytes
        run: |
          echo 'aa2a6cba2aa4bd9ab1083aa15ea64e831e01f81cf3e4d42544a15d9a420fec9e  package-lock.json' | sha256sum -c -
          npm install --ignore-scripts --save-exact terser@5.44.0
          echo '7d9787650ad10fcafee21db223ce2bb76b2e9dc6ac6b943404b260e3b7f47280  package-lock.json' | sha256sum -c -
          echo 'f25ba05c24f8deafcc292e150cb74f895bf3943320728431120d2787bdd9a018  package.json' | sha256sum -c -
          npm run test:builtin
          npm run build
          git diff --check
      - name: Save only the dependency lock and remove this one-time workflow
        run: |
          rm .github/workflows/prepare-pinned-minifier-lock.yml
          git config user.name 'Tessera verification'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/prepare-pinned-minifier-lock.yml
          git commit -m 'Pin Terser 5.44.0 with the reviewed dependency lock'
          git push origin HEAD:feature/builtin-runtime-foundation-v1
