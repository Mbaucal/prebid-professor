name: Integrate daily ads.txt monitoring

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-daily-cron.trigger

permissions:
  contents: write

concurrency:
  group: monitoring-daily-cron-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate daily monitoring scheduler
        run: python3 .github/scripts/integrate_monitoring_daily_cron.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add \
            worker/ads-txt.ts \
            worker/monitoring-email-preview.ts \
            worker/monitoring-notification-settings.ts \
            worker/monitoring-notification-run.ts \
            worker/monitoring-scheduler.ts \
            worker/app-deploy.ts \
            wrangler.jsonc \
            src/components/MonitoringNotificationRules.tsx \
            src/components/MonitoringReadonlyPanel.tsx
          if git diff --cached --quiet; then
            echo "Daily monitoring scheduler is already integrated."
          else
            git commit -m "Add daily ads.txt monitoring cron"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi
