name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build dashboard and Worker
        run: npm run build

      - name: Verify read-only A/B and cache console diagnostics
        run: node --test tests/runtime/experiment-inspect.test.mjs

      - name: Verify minimum-height CSS export
        run: node --experimental-strip-types --test tests/runtime/min-height-css-export.test.mjs
