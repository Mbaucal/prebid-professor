name: CI

on:
  push:
    branches: [main, feature/isolated-runtime-workspace-v1]
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install dependencies
        run: node scripts/bootstrap-toolchain.mjs --profile test

      - name: Check browser, Worker and build-tool types
        run: node scripts/isolated-toolchain.mjs typecheck --profile test

      - name: Build dashboard and Worker
        run: node scripts/isolated-toolchain.mjs build --profile test

      - name: Verify historical closure, negative guards and installed audits
        run: |
          node --test tests/runtime/toolchain-isolation.test.mjs
          node scripts/audit-isolated-toolchain.mjs --profile test

      - name: Keep isolated toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-isolated-toolchain-evidence
          path: .generated/toolchain-evidence/*.json
