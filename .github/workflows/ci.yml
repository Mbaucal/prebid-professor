name: CI

on:
  push:
    branches: [main, feature/isolated-runtime-workspace-v1]
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check browser, Worker and build-tool types
        run: npm run typecheck

      - name: Build dashboard and Worker
        run: npm run build
