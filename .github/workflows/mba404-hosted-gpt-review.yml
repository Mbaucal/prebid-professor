name: MBA-404 hosted GPT verification (no ad traffic)
on:
  push:
    branches: [review/mba404-hosted-gpt]
permissions:
  contents: read
jobs:
  hosted-gpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Verify exact hosted package with real GPT, pending CMP and frequency cap
        run: python scripts/review-hosted-gpt.py
        env:
          REVIEW_ADS_URL: https://31bc4028.tanjug.pages.dev/ads.js
          REVIEW_ADS_SHA256: 143a8fe5d788b3a17d57e133d83701b0ddade512e086c24a0ba972db43f60f85
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hosted-gpt-review
          path: .generated/hosted-gpt-review/
          if-no-files-found: warn
