          if return_fields_anchor not in releases:
              raise SystemExit('runtimeData return anchor was not found.')
          releases = releases.replace(return_fields_anchor, return_fields_replacement, 1)

          compile_call_anchor = '''      generatorProfileId: snapshot.profile.id,
      gamPath: snapshot.site.gam_path,'''
          compile_call_replacement = '''      generatorProfileId: snapshot.profile.id,
