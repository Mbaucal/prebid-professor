    allowClosePortal: stickyControls.allowClosePortal === true,
    floorsEnabled: floorControls.enabled !== false,
    floorCurrency,
    hardFloor: Number.isFinite(hardFloor) && hardFloor >= 0 ? hardFloor : 0.04,
    bidderFloors: normalizeNumberRecord(floorControls.bidderFloors),
    floorRules: normalizeNumberRecord(floorControls.rules),
    cleanComments: outputControls.cleanComments !== false,
