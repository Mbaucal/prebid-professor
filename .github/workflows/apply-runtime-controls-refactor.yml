          releases = releases.replace(user_sync_anchor, user_sync_replacement, 1)

          return_fields_anchor = '''    globalRefresh: isRecord(defaultRule.refresh) ? defaultRule.refresh as JsonRecord
      : isRecord(atfRule.refresh) ? atfRule.refresh as JsonRecord : {},
    maxCmpTimeout,
  };'''
          return_fields_replacement = '''    globalRefresh: isRecord(defaultRule.refresh) ? defaultRule.refresh as JsonRecord
      : isRecord(atfRule.refresh) ? atfRule.refresh as JsonRecord : {},
    maxCmpTimeout,
    stickyBottomAdUnitId: typeof stickyControls.bottomAdUnitId === 'string'
      ? stickyControls.bottomAdUnitId.trim()
      : activeCodes.has('Sticky') ? 'Sticky' : '',
    stickyTopAdUnitId: typeof stickyControls.topAdUnitId === 'string'
      ? stickyControls.topAdUnitId.trim()
