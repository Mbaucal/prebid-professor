name: Integrate monitoring legacy schema upgrade

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-legacy-schema-upgrade.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate legacy schema upgrade
        run: python3 .github/scripts/integrate_monitoring_legacy_schema_upgrade.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add worker/monitoring-notification-settings.ts worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Legacy schema upgrade is already integrated."
          else
            git commit -m "Upgrade legacy monitoring notification schema"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
