name: Consent readiness checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths:
      - worker/**
      - shared/**
      - src/components/DealsPanel.tsx
      - src/components/OutstreamSettingsPanel.tsx
      - src/components/BiddersPanel.tsx
      - src/components/AdUnitsPanel.tsx
      - src/components/ConfigPanel.tsx
      - src/components/SizeMapsCompatPanel.tsx
      - src/download/**
      - src/components/ScriptSetupPanel.tsx
      - src/components/SiteRuntimePanel.tsx
      - src/site-workspace/**
      - scripts/**
      - tests/**
      - vendor/**
      - tools/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/consent-readiness-checks.yml
  push:
    branches: [feature/isolated-runtime-workspace-v1]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked tools without lifecycle scripts
        run: node scripts/bootstrap-toolchain.mjs
      - name: Prepare runtime and local-only fixtures
        run: |
          node scripts/isolated-toolchain.mjs build
          node scripts/prepare-test-workspace.mjs
          node --experimental-strip-types scripts/prepare-readiness-browser-fixtures.mjs
          node --experimental-strip-types scripts/prepare-revenue-browser-fixtures.mjs
          node scripts/prepare-outstream-responsive-fixtures.mjs
          node --experimental-strip-types scripts/prepare-readiness-browser-fixtures.mjs --stable
          node --experimental-strip-types scripts/prepare-revenue-browser-fixtures.mjs --stable
          node scripts/prepare-outstream-responsive-fixtures.mjs --stable
          node --experimental-strip-types scripts/prepare-runtime3161-browser-fixtures.mjs
      - name: Consent, deadline, reporting and pending-slot regressions
        run: node --experimental-strip-types --test tests/runtime/consent-readiness.test.mjs
      - name: Verified 3.16.1 corrections, preserved history and saved-package contracts
        run: |
          node scripts/check-runtime-release-history.mjs HEAD^
          node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/runtime3161-fixes.test.mjs tests/runtime/runtime3161-readiness.test.mjs tests/runtime/runtime3161-artifact.test.mjs tests/runtime/refresh-counting.test.mjs
      - name: Deals and Outstream contracts, routes and exact package integration
        run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/deals.test.mjs tests/runtime/deal-settings.test.mjs tests/runtime/outstream-settings.test.mjs tests/runtime/revenue-integration.test.mjs tests/runtime/test-revenue-settings.test.mjs tests/runtime/outstream-position-scope.test.mjs tests/runtime/outstream-responsive.test.mjs tests/runtime/browser-package-download.test.mjs tests/runtime/runtime-labels.test.mjs
      - name: Install pinned Chromium verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Generated scripts with real Prebid and intercepted CMP/GPT
        run: |
          python scripts/verify-consent-readiness.py
          python scripts/verify-consent-readiness.py --stable
          python scripts/verify-consent-readiness.py --fixtures-dir .generated/runtime3161-evidence/fixed
      - name: Native 3.16.1 before/after and delayed-consent dispatch boundaries
        run: |
          python scripts/verify-runtime3161-browser.py
          python scripts/audit-native-observe-20261024.py --fixtures-dir .generated/runtime3161-evidence/fixed --expect-fixed --resize-checks
          python scripts/audit-native-cmp-gap-20261024.py --script .generated/runtime3161-evidence/fixed/cmp-gap.js --expect-fixed
      - name: Atomic consent boundary and failure-detection controls
        run: |
          python scripts/verify-consent-boundary.py
          python scripts/verify-consent-boundary.py --stable
      - name: Script version choices, preserved settings and desktop/mobile setup
        run: python scripts/verify-readiness-setup.py
      - name: Native Deals and selected Outstream creative; synthetic demand only
        run: |
          python scripts/verify-deals-native.py
          python scripts/verify-outstream-native.py
          python scripts/verify-outstream-responsive-native.py
          python scripts/verify-deals-native.py --stable
          python scripts/verify-outstream-native.py --stable
          python scripts/verify-outstream-responsive-native.py --stable
      - name: Revenue settings on desktop and narrow screens
        run: |
          failed=0
          for script in \
            scripts/verify-deals-ui.py \
            scripts/verify-outstream-ui.py \
            scripts/verify-revenue-workspace.py \
            scripts/verify-revenue-download.py \
            scripts/verify-outstream-responsive-ui.py \
            scripts/verify-outstream-responsive-workspace.py \
            scripts/verify-main-revenue-workspace.py
          do
            python "$script" || failed=1
          done
          exit "$failed"
      - name: Stable 3.16.0 native package and desktop/mobile workflow
        run: python scripts/verify-main-revenue-workspace.py --stable
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consent-readiness-evidence
          path: |
            .generated/readiness-evidence/browser-results.json
            .generated/readiness-evidence/boundary-results.json
            .generated/readiness-setup-evidence/*.json
            .generated/readiness-setup-evidence/*.png
            .generated/revenue-evidence/*.json
            .generated/deals-ui-evidence/*.json
            .generated/deals-ui-evidence/*.png
            .generated/outstream-evidence/*.json
            .generated/outstream-evidence/*.png
            .generated/outstream-ui-evidence/*.json
            .generated/outstream-ui-evidence/*.png
            .generated/revenue-workspace-evidence/*.json
            .generated/revenue-workspace-evidence/*.png
            .generated/revenue-download-evidence/*.json
            .generated/revenue-download-evidence/*.png
            .generated/outstream-responsive-ui-evidence/*.json
            .generated/outstream-responsive-ui-evidence/*.png
            .generated/outstream-responsive-evidence/*.json
            .generated/outstream-responsive-evidence/*.png
            .generated/outstream-responsive-workspace-evidence/*.json
            .generated/outstream-responsive-workspace-evidence/*.png
            .generated/main-revenue-workspace-evidence/*.json
            .generated/main-revenue-workspace-evidence/*.png
            .generated/stable-readiness-evidence/*.json
            .generated/stable-revenue-evidence/*.json
            .generated/stable-revenue-evidence/*.png
            .generated/stable-outstream-evidence/*.json
            .generated/stable-outstream-evidence/*.png
            .generated/stable-outstream-responsive-evidence/*.json
            .generated/stable-outstream-responsive-evidence/*.png
            .generated/stable-main-revenue-workspace-evidence/*.json
            .generated/stable-main-revenue-workspace-evidence/*.png
            .generated/runtime3161-evidence/browser-results.json
            .generated/runtime3161-evidence/fixed/browser-results.json
            .generated/audit-independent-review/native-working-candidate.json
            .generated/audit-independent-review/native-cmp-min-gap.json
