name: Fix Release Diff nested IDs

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
  push:
    branches:
      - feature/release-diff
    paths:
      - .github/release-diff-fix.trigger

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.head_ref == 'feature/release-diff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-diff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve nested ID parameters
        run: python3 .github/scripts/fix_release_diff_nested_ids.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit review fix
        run: |
          git config user.name "Tessera Release Diff"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ReleaseDiffPanel.tsx
          if git diff --cached --quiet; then
            echo "Review fix is already committed."
            exit 0
          fi
          git commit -m "Preserve nested bidder IDs in release diffs"
          git push origin HEAD:feature/release-diff
