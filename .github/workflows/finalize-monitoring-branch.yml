name: Finalize Monitoring branch

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/finalize-monitoring.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final Monitoring cleanup
        run: python3 .github/scripts/finalize_monitoring_branch.py

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard and Worker
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Commit finalized branch
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Monitoring branch before acceptance" || exit 0
          git push origin HEAD:feature/monitoring-readonly-v1
