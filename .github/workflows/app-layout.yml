name: Dashboard layout checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths: [src/**, scripts/prepare-layout-preview.mjs, scripts/layout-ui-fixture.mjs, scripts/verify-app-layout.py, worker/test-workspace/layout-preview.mjs, .github/workflows/app-layout.yml]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build && node scripts/prepare-layout-preview.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify-app-layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-evidence
          path: .generated/layout-evidence/
          retention-days: 14
