name: Patch managed ads.txt file site safety

on:
  push:
    branches:
      - feature/ads-txt-managed-file-v1
    paths:
      - .github/patch-managed-file-site-safety.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ads-txt-managed-file-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply site-safety fixes
        run: python3 .github/scripts/patch_managed_file_site_safety.py

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard and Worker
        run: npm run build

      - name: Check patch formatting
        run: git diff --check

      - name: Remove one-time patch files
        run: |
          rm -f .github/scripts/patch_managed_file_site_safety.py
          rm -f .github/workflows/patch-managed-file-site-safety.yml
          rm -f .github/patch-managed-file-site-safety.trigger

      - name: Commit fixes
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden managed ads.txt site switching" || exit 0
          git push origin HEAD:feature/ads-txt-managed-file-v1
