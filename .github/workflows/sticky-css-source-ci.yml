name: Sticky CSS source build check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply sticky CSS source integration
        run: python3 .github/scripts/apply_sticky_css_direct.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build patched source
        run: npm run --ignore-scripts build
