name: Sticky CSS source build check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply sticky CSS source integration
        id: patch
        continue-on-error: true
        run: python3 .github/scripts/apply_sticky_css_direct_v2.py > sticky-css-patch.log 2>&1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sticky-css-patch-log
          path: sticky-css-patch.log
          if-no-files-found: error

      - name: Stop on patch failure
        if: steps.patch.outcome == 'failure'
        run: |
          cat sticky-css-patch.log
          exit 1

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: sticky-css-patched-source
          path: |
            worker/releases.ts
            worker/app-deploy.ts
            src/components/ReleasesPanel.tsx
            src/components/ExportPanel.tsx
            .github/workflows/deploy-pages-release.yml
          if-no-files-found: error

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build patched source
        run: npm run --ignore-scripts build
