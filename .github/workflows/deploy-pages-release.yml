name: Deploy Prebid release to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Internal deployment correlation ID
        required: true
        type: string
      callback_url:
        description: Prebid Professor callback URL
        required: true
        type: string
      site_id:
        description: Site ID
        required: true
        type: string
      release_id:
        description: Release ID
        required: true
        type: string
      release_version:
        description: Release version
        required: true
        type: string
      release_base_url:
        description: Public immutable release URL
        required: true
        type: string
      manifest_sha256:
        description: Exact source manifest checksum from the platform
        required: true
        type: string
      github_environment:
        description: Repository secret name containing the scoped Cloudflare API token
        required: true
        type: string
      account_id:
        description: Target Cloudflare account ID
        required: true
        type: string
      project_name:
        description: Target Cloudflare Pages project
        required: true
        type: string
      branch:
        description: Pages production or preview branch
        required: true
        type: string
      channel:
        description: Deployment channel
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: prebid-pages-${{ inputs.account_id }}-${{ inputs.project_name }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.site_id }} · ${{ inputs.release_version }} · ${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_INPUTS: ${{ toJSON(inputs) }}
    outputs:
      identity_ok: ${{ steps.identity.outcome }}
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      alias_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
      evidence_name: pages-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate deployment identity and destinations before credentials
        id: identity
        run: node scripts/pages-release-verification.mjs validate
      - name: Verify source package and actual Pages production branch
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[inputs.github_environment] }}
        run: node scripts/pages-release-verification.mjs prepare
      - name: Preserve the verified source inventory before deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/pages-release/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Deploy the verified package with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets[inputs.github_environment] }}
          accountId: ${{ inputs.account_id }}
          wranglerVersion: "4.118.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy .generated/pages-release/dist
            --project-name=${{ inputs.project_name }}
            --branch=${{ inputs.branch }}
            --commit-dirty=false
            --commit-message="Tessera ${{ inputs.channel }} ${{ inputs.site_id }} ${{ inputs.release_version }}"

  verify:
    name: Verify public release bytes (read only)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_INPUTS: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.deploy.outputs.evidence_name }}
          path: .generated/pages-release
      - name: Verify every published file and delivery headers
        env:
          PAGES_DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: node scripts/pages-release-verification.mjs verify-public
      - name: Preserve public verification evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/pages-release/public-verification.json
          if-no-files-found: error
          retention-days: 14

  report:
    name: Update platform status (no deployment)
    needs: [deploy, verify]
    if: ${{ always() && needs.deploy.outputs.identity_ok == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_INPUTS: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Report the independent deployment and verification outcomes
        env:
          CALLBACK_SECRET: ${{ secrets.PREBID_PROFESSOR_CALLBACK_SECRET }}
          DEPLOY_OUTCOME: ${{ needs.deploy.result }}
          VERIFY_OUTCOME: ${{ needs.verify.result }}
          PAGES_DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          PAGES_ALIAS_URL: ${{ needs.deploy.outputs.alias_url }}
        run: node scripts/pages-release-verification.mjs callback
