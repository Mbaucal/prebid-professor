name: Tanjug passive bid readiness
on:
  pull_request:
    paths:
      - 'worker/runtime-readiness/**'
      - 'scripts/prepare-tanjug-readiness.mjs'
      - 'scripts/verify-tanjug-aa.py'
      - 'tests/runtime/*readiness*'
      - 'src/debug/experiment-inspect.mjs'
      - '.github/workflows/tanjug-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Preserve archived runtimes and build separate full diagnostic release
        run: |
          node scripts/check-runtime-release-history.mjs HEAD^
          node scripts/prepare-builtin-runtime.mjs
          node --experimental-strip-types scripts/prepare-tanjug-pilot.mjs
          node scripts/prepare-tanjug-aa.mjs
          node scripts/prepare-tanjug-readiness.mjs
          node --test tests/runtime/bid-readiness.test.mjs tests/runtime/readiness-package.test.mjs tests/runtime/experiment-inspect.test.mjs tests/runtime/static-aa.test.mjs
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exact full package and native bids with all external traffic intercepted
        env:
          TANJUG_PACKAGE_DIR: .generated/tanjug-readiness/deploy
        run: python scripts/verify-tanjug-aa.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tanjug-readiness-evidence
          path: |
            .generated/tanjug-readiness/*.zip
            .generated/tanjug-readiness/*.json
          if-no-files-found: error
          retention-days: 30
