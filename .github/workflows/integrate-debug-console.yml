name: Integrate Debug Console

on:
  push:
    branches:
      - feature/debug-console
    paths:
      - .github/debug-console.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/debug-console
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate Debug Console
        run: python3 .github/scripts/integrate_debug_console.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit application integration
        run: |
          git config user.name "Prebid Professor Debug Console"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/main.tsx worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Debug Console integration is already committed."
            exit 0
          fi
          git commit -m "Connect site Debug Console"
          git push origin HEAD:feature/debug-console
