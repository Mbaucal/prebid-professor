name: Agency hierarchy checks
on:
  pull_request:
    branches: [main, feature/isolated-runtime-workspace-v1]
    paths: [tools/**, package.json, package-lock.json, tsconfig*.json, vite.config.ts, wrangler.jsonc, scripts/**, tests/runtime/local-miniflare.test.mjs, src/**, worker/organization/**, worker/app-builtin-runtime-preview.ts, worker/test-workspace/**, tests/runtime/organization.test.mjs, .github/workflows/agency-hierarchy.yml]
permissions:
  contents: read
jobs:
  agencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: UTC
      TESSERA_TEST_TOOLCHAIN: isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: node scripts/bootstrap-toolchain.mjs
      - run: node scripts/isolated-toolchain.mjs typecheck
      - run: node scripts/isolated-toolchain.mjs build && node scripts/prepare-test-workspace.mjs
      - run: node --experimental-strip-types --experimental-loader ./tests/support/ts-extension-loader.mjs --test tests/runtime/organization.test.mjs tests/runtime/test-workspace-schema-guards.test.mjs
      - run: node scripts/verify-organization-workerd.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify-agency-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-hierarchy-evidence
          path: .generated/agency-evidence/
          retention-days: 14
