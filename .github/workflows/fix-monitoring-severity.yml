name: Fix monitoring severity

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply severity fix
        run: python3 .github/scripts/fix_monitoring_severity.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit fixed source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add worker/monitoring.ts
          if git diff --cached --quiet; then
            echo "Monitoring severity is already fixed."
            exit 0
          fi
          git commit -m "Respect disabled monitoring checks in status severity"
          git push origin HEAD:${{ github.head_ref }}
