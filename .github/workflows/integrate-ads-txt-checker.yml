name: Integrate ads.txt checker

on:
  push:
    branches:
      - feature/ads-txt-checker
    paths:
      - .github/ads-txt-checker.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ads-txt-checker
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate Ads.txt panel
        run: python3 .github/scripts/integrate_ads_txt_checker.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit application integration
        run: |
          git config user.name "Prebid Professor Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Ads.txt App integration is already committed."
            exit 0
          fi
          git commit -m "Connect Ads.txt checker tab"
          git push origin HEAD:feature/ads-txt-checker
