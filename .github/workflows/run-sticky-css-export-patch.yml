name: Run sticky CSS export patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-sticky-css-export-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sticky-css-export
          fetch-depth: 0

      - name: Extract branch patch safely
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-sticky-css-export.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          lines = workflow.splitlines()

          step_marker = '      - name: Add sticky CSS release artifact and export UI'
          run_marker = '        run: |'
          end_marker = '      - name: Build'

          try:
              step_index = lines.index(step_marker)
          except ValueError as error:
              raise SystemExit('Sticky CSS patch step was not found in the feature workflow.') from error

          try:
              run_index = next(
                  index for index in range(step_index + 1, len(lines))
                  if lines[index] == run_marker
              )
          except StopIteration as error:
              raise SystemExit('Sticky CSS patch run block was not found.') from error

          try:
              end_index = next(
                  index for index in range(run_index + 1, len(lines))
                  if lines[index] == end_marker
              )
          except StopIteration as error:
              raise SystemExit('Sticky CSS patch end marker was not found.') from error

          yaml_indent = '          '
          script_lines = []
          for source_line_number, line in enumerate(lines[run_index + 1:end_index], start=run_index + 2):
              if not line:
                  script_lines.append('')
                  continue
              if not line.startswith(yaml_indent):
                  raise SystemExit(
                      f'Unexpected indentation at workflow line {source_line_number}: {line!r}'
                  )
              script_lines.append(line[len(yaml_indent):])

          script = '\n'.join(script_lines).rstrip() + '\n'
          output = Path('/tmp/apply-sticky-css-export.py')
          output.write_text(script, encoding='utf-8')

          try:
              compile(script, str(output), 'exec')
          except SyntaxError as error:
              excerpt = script.splitlines()
              start = max(0, (error.lineno or 1) - 5)
              end = min(len(excerpt), (error.lineno or 1) + 4)
              print('Extracted patch script has invalid Python syntax:')
              for index in range(start, end):
                  print(f'{index + 1:04d}: {excerpt[index]}')
              raise

          print(f'Extracted and validated {len(script_lines)} Python lines.')

      - name: Apply sticky CSS patch
        run: python /tmp/apply-sticky-css-export.py

      - name: Build
        run: npm run build

      - name: Commit patched feature
        run: |
          git config user.name "Prebid Professor Sticky CSS"
          git config user.email "actions@users.noreply.github.com"
          git add worker/releases.ts worker/app-deploy.ts src/components/ReleasesPanel.tsx src/components/ExportPanel.tsx .github/workflows/deploy-pages-release.yml
          git commit -m "Add sticky CSS release artifact and export"
          git push origin HEAD:feature/sticky-css-export
