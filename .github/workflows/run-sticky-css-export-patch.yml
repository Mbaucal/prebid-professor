name: Run sticky CSS export patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-sticky-css-export-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sticky-css-export
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply sticky CSS patch
        run: python .github/scripts/apply_sticky_css_export.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit patched feature
        run: |
          git config user.name "Prebid Professor Sticky CSS"
          git config user.email "actions@users.noreply.github.com"
          git add worker/releases.ts worker/app-deploy.ts src/components/ReleasesPanel.tsx src/components/ExportPanel.tsx .github/workflows/deploy-pages-release.yml
          if git diff --cached --quiet; then
            echo "No sticky CSS changes remained to commit."
          else
            git commit -m "Add sticky CSS release artifact and export"
            git push origin HEAD:feature/sticky-css-export
          fi
