name: Integrate read-only monitoring

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-readonly.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate monitoring workspace
        run: python3 .github/scripts/integrate_monitoring_readonly.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/main.tsx worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Read-only monitoring integration is already committed."
            exit 0
          fi
          git commit -m "Connect read-only monitoring workspace"
          git push origin HEAD:feature/monitoring-readonly-v1
