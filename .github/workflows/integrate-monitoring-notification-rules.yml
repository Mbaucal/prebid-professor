name: Integrate monitoring notification rules

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/monitoring-notification-rules.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate notification rules
        run: python3 .github/scripts/integrate_monitoring_notification_rules.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Monitoring"
          git config user.email "actions@users.noreply.github.com"
          git add -A worker/app-deploy.ts worker/monitoring-email-send.ts src/components/MonitoringReadonlyPanel.tsx
          if git diff --cached --quiet; then
            echo "Notification rules integration is already committed."
          else
            git commit -m "Enable staged ads.txt notification rules"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
