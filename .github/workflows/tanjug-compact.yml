name: Tanjug minified production delivery
on:
  pull_request:
    paths:
      - 'scripts/prepare-tanjug-compact.mjs'
      - 'scripts/static-aa-package.mjs'
      - 'scripts/verify-tanjug-aa.py'
      - 'tests/runtime/compact-aa.test.mjs'
      - '.github/workflows/tanjug-compact.yml'
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Build new minified delivery without changing accepted A/A bytes
        run: |
          node scripts/check-runtime-release-history.mjs HEAD^
          node scripts/prepare-builtin-runtime.mjs
          node --experimental-strip-types scripts/prepare-tanjug-pilot.mjs
          node scripts/prepare-tanjug-aa.mjs
          node scripts/prepare-tanjug-compact.mjs
          node scripts/prepare-tanjug-compact.mjs
          node --test tests/runtime/compact-aa.test.mjs tests/runtime/static-aa.test.mjs
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify exact minified package without external ad traffic
        env:
          TANJUG_PACKAGE_DIR: .generated/tanjug-compact/deploy
        run: python scripts/verify-tanjug-aa.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tanjug-compact-evidence
          path: |
            .generated/tanjug-compact/*.zip
            .generated/tanjug-compact/*.json
            .generated/tanjug-compact/*.txt
          if-no-files-found: error
          retention-days: 30
