name: Apply sticky CSS export directly

on:
  push:
    branches:
      - feature/sticky-css-export
    paths:
      - .github/sticky-direct.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sticky-css-export
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply sticky CSS patch
        run: python .github/scripts/apply_sticky_css_export.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit implementation and remove temporary patch files
        run: |
          git config user.name "Prebid Professor Sticky CSS"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/scripts/apply_sticky_css_export.py
          rm -f .github/workflows/apply-sticky-direct.yml
          rm -f .github/sticky-direct.trigger
          git add -A
          git commit -m "Add sticky CSS release artifact and export"
          git push origin HEAD:feature/sticky-css-export
