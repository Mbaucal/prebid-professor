name: Clarify ads.txt repeated-entry labels

on:
  push:
    branches:
      - feature/monitoring-readonly-v1
    paths:
      - .github/ads-txt-repeat-labels.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/monitoring-readonly-v1
          fetch-depth: 0

      - name: Clarify ads.txt repeated-entry labels
        run: python3 .github/scripts/clarify_ads_txt_repeat_labels.py

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Ads.txt"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AdsTxtPanel.tsx PROJECT.md
          if git diff --cached --quiet; then
            echo "Ads.txt repeated-entry labels are already clear."
          else
            git commit -m "Clarify ads.txt repeated entry labels"
            git push origin HEAD:feature/monitoring-readonly-v1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build
