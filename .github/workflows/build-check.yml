name: Build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.2.15
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Set up Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies exactly like Cloudflare build
        run: bun install

      - name: Build and capture complete output
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
