name: Integrate Release Diff

on:
  push:
    branches:
      - feature/release-diff
    paths:
      - .github/release-diff.trigger

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-diff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate Release Diff
        run: python3 .github/scripts/integrate_release_diff.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard and Worker
        run: npm run build

      - name: Commit integrated source
        run: |
          git config user.name "Tessera Release Diff"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ReleasesPanel.tsx src/components/ReleaseDiffPanel.tsx worker/app-deploy.ts
          if git diff --cached --quiet; then
            echo "Release Diff integration is already committed."
            exit 0
          fi
          git commit -m "Connect Release Diff workspace"
          git push origin HEAD:feature/release-diff
