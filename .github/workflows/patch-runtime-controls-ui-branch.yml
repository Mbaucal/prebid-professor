name: Patch runtime controls UI branch

on:
  push:
    branches:
      - main
    paths:
      - .github/runtime-controls-ui-hotfix.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-controls-review
          fetch-depth: 0

      - name: Apply UI fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/RuntimeControlsPanel.tsx')
          source = path.read_text(encoding='utf-8')
          original = source

          source = source.replace(
              '''  floors: {
    enabled: boolean;''',
              '''  floors: {
    configured: boolean;
    enabled: boolean;''',
              1,
          )
          source = source.replace(
              '''  allowClosePortal: boolean;
  floorsEnabled: boolean;''',
              '''  allowClosePortal: boolean;
  floorsConfigured: boolean;
  floorsEnabled: boolean;''',
              1,
          )
          source = source.replace(
              '''    allowClosePortal: payload.controls.sticky.allowClosePortal,
    floorsEnabled: payload.controls.floors.enabled,''',
              '''    allowClosePortal: payload.controls.sticky.allowClosePortal,
    floorsConfigured: payload.controls.floors.configured,
    floorsEnabled: payload.controls.floors.enabled,''',
              1,
          )

          old_loading = '''  if (loading || !form || !payload) {
    return <div className="config-loading">Loading runtime controls…</div>;
  }
'''
          new_loading = '''  if (loading) {
    return <div className="config-loading">Loading runtime controls…</div>;
  }

  if (!form || !payload) {
    return (
      <section className="runtime-controls-page">
        <div className="runtime-controls-heading">
          <div>
            <span className="panel-kicker">Reusable runtime behavior</span>
            <h2>Runtime controls</h2>
          </div>
        </div>
        <div className="form-error config-error">{error || 'Runtime controls could not be loaded.'}</div>
        <button className="button secondary" onClick={() => void load()} type="button">Retry</button>
      </section>
    );
  }
'''
          if old_loading not in source:
              raise SystemExit('Loading-state anchor was not found.')
          source = source.replace(old_loading, new_loading, 1)

          notice_anchor = '''      {error ? <div className="form-error config-error">{error}</div> : null}
      {message ? <div className="runtime-controls-message">{message}</div> : null}
'''
          notice_replacement = '''      {error ? <div className="form-error config-error">{error}</div> : null}
      {message ? <div className="runtime-controls-message">{message}</div> : null}
      {!form.floorsConfigured ? (
        <div className="runtime-controls-message">
          Floor controls have not been saved for this site. The current generator template keeps its existing legacy floor behavior until you click Save runtime controls.
        </div>
      ) : null}
'''
          if notice_anchor not in source:
              raise SystemExit('Message anchor was not found.')
          source = source.replace(notice_anchor, notice_replacement, 1)

          if source == original:
              raise SystemExit('RuntimeControlsPanel.tsx was not changed.')
          path.write_text(source, encoding='utf-8')

      - name: Commit fix branch
        run: |
          git config user.name "Prebid Professor Review Fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/RuntimeControlsPanel.tsx
          git commit -m "Fix runtime controls loading and floor opt-in state"
          git push origin HEAD:fix/runtime-controls-review
